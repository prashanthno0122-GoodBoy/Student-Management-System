
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contact Us - Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                Student Management System
            </a>
            <a class="nav-link text-white" href="index.html">Home</a>
        </div>
    </nav>

    <main class="container mt-5">
        <h1>Contact Us</h1>
        <p>Send us your questions or feedback.</p>

        <form id="contactForm" class="mt-4" style="max-width: 600px;">

            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control"
                       placeholder="Enter your name" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control"
                       placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" class="form-control"
                          rows="4" placeholder="Write your message"
                          required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Send Message
            </button>

        </form>

        <p id="result" class="mt-3" role="status"></p>
    </main>

    <footer class="text-center mt-5 py-3 bg-light">
        <p>&copy; 2026 Student Management System</p>
    </footer>

    <script>
        document.getElementById("contactForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                document.getElementById("result").textContent =
                    "Thank you! Your form has been validated.";
            });
    </script>

</body>
</html>
